<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking SITTA</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar"><a href="dashboard.html">← Dashboard</a><span style="color:white;margin-left:20px;">Tracking Pengiriman</span></nav>
    <div class="container">
        <h3>Input Nomor Delivery Order</h3>
        <div class="input-group"><input type="text" id="noDO" placeholder="Contoh: DO123456"><button id="btnCari">Cari</button></div>
        <div id="hasil" style="display:none;margin-top:20px;">
            <h4>Nama Mahasiswa: <span id="namaMhs">-</span></h4>
            <p>Status Pengiriman:</p>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <p id="statusText" style="font-weight:bold;"></p>
            <table>
                <tr>
                    <td>Ekspedisi</td>
                    <td id="ekspedisi">-</td>
                </tr>
                <tr>
                    <td>Tanggal Kirim</td>
                    <td id="tglKirim">-</td>
                </tr>
                <tr>
                    <td>Jenis Paket</td>
                    <td id="jenisPaket">-</td>
                </tr>
                <tr>
                    <td>Total Pembayaran</td>
                    <td id="total">-</td>
                </tr>
            </table>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
