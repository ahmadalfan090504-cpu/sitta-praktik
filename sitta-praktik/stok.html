<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok SITTA</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar"><a href="dashboard.html">← Dashboard</a><span style="color:white;margin-left:20px;">Informasi Stok Bahan Ajar</span></nav>
    <div class="container">
        <h3>Data Stok Bahan Ajar</h3>
        <table>
            <thead>
                <tr>
                    <th>Kode</th>
                    <th>Nama Bahan Ajar</th>
                    <th>Stok</th>
                    <th>Lokasi</th>
                </tr>
            </thead>
            <tbody id="bodyTabel"></tbody>
        </table>
        <div style="margin-top:25px;border-top:1px solid #eee;padding-top:15px;">
            <h4>Tambah Stok Baru (Fitur DOM)</h4>
            <input type="text" id="kode" placeholder="Kode MK">
            <input type="text" id="nama" placeholder="Nama Bahan Ajar">
            <input type="number" id="stok" placeholder="Jumlah Stok">
            <input type="text" id="lokasi" placeholder="Lokasi Gudang">
            <button id="btnTambah">Tambah Baris</button>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
